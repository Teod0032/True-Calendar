<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calendar Homo Sapiens</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --gold: #FFD700;
            --bg-dark: rgba(0, 0, 0, 0.75);
            --overlay-dark: rgba(0, 0, 0, 0.85);
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            /* Prevent text selection and the magnifying glass on long-press */
            -webkit-touch-callout: none;
            user-select: none; 
        }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Background Image Setup */
        .background {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('backdrop.png'); /* Put your background image here */
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Touch interaction layer */
        #touchArea {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 20px 20px;
        }

        /* Header */
        header {
            text-align: center;
            z-index: 1;
        }
        
        h1 {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin: 0;
            text-shadow: -1px 1px 10px rgba(0, 0, 0, 0.75);
        }

        /* Bottom Card */
        .bottom-card {
            background-color: var(--bg-dark);
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
            z-index: 100; /* Stays above overlay */
        }

        .label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .date-text {
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 5px 0;
        }

        .divider {
            height: 1px;
            width: 40px;
            background-color: #444;
            margin: 10px auto;
        }

        .time-text {
            color: var(--gold);
            font-size: 1.75rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            margin: 0;
        }

        /* Overlay */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--overlay-dark);
            z-index: 50;
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
        }

        .popup-box {
            width: 85%;
            max-width: 350px;
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid var(--gold);
            text-align: center;
            margin-bottom: 150px; /* Push it up above the date box */
        }

        .popup-text {
            color: white;
            font-size: 1.125rem;
            line-height: 1.5;
            font-weight: 500;
            margin: 0;
        }

        .close-hint {
            margin-top: 15px;
            color: #666;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div id="overlay">
        <div class="popup-box">
            <p class="popup-text">
                The current year counting from the emergence of Homo sapiens (approx. 315,000 years ago). We are now in year 1 of the new millennium cycle.
            </p>
            <div class="close-hint">(Tap screen to close)</div>
        </div>
    </div>

    <div id="touchArea">
        <header>
            <h1>Homo Sapiens Era</h1>
        </header>

        <div class="bottom-card">
            <div class="label">Current Date</div>
            <div class="date-text" id="dateDisplay">--</div>
            <div class="divider"></div>
            <div class="time-text" id="timeDisplay">--:--:--</div>
        </div>
    </div>

    <script>
        // --- 1. CLOCK LOGIC ---
        const YEAR_OFFSET = 315001 - 2026; 

        function updateClock() {
            const now = new Date();
            
            const weekday = now.toLocaleDateString('en-US', { weekday: 'short' }); 
            const month = now.toLocaleDateString('en-US', { month: 'short' });   
            const day = now.getDate();                                           
            const currentYear = now.getFullYear();
            
            const sapiensYear = currentYear + YEAR_OFFSET;
            
            // Format: "Mon, 5 Jan 315001"
            document.getElementById('dateDisplay').innerText = `${weekday}, ${day} ${month} ${sapiensYear}`;
            document.getElementById('timeDisplay').innerText = now.toLocaleTimeString('en-US', { hour12: false });
        }

        setInterval(updateClock, 1000);
        updateClock(); // Initial call

        // --- 2. TOUCH & VIBRATION LOGIC ---
        let timerOne = null;
        let timerTwo = null;
        const touchArea = document.getElementById('touchArea');
        const overlay = document.getElementById('overlay');

        function stopTimers() {
            clearTimeout(timerOne);
            clearTimeout(timerTwo);
            // Cancel vibration if supported
            if ("vibrate" in navigator) navigator.vibrate(0);
        }

        function handlePressIn(e) {
            // Prevent default behavior (like text selection or context menus) if it's a touch event
            if (e.cancelable) e.preventDefault();
            
            stopTimers();
            
            // 1 Second: Short Buzz
            timerOne = setTimeout(() => {
                if ("vibrate" in navigator) navigator.vibrate(100);
            }, 1000);

            // 2 Seconds: Success Buzz & Show Overlay
            timerTwo = setTimeout(() => {
                if ("vibrate" in navigator) navigator.vibrate(200);
                overlay.style.display = 'flex';
            }, 2000);
        }

        function handlePressOut(e) {
            stopTimers();
        }

        // Event Listeners for mobile touches and desktop mouse clicks
        touchArea.addEventListener('touchstart', handlePressIn, {passive: false});
        touchArea.addEventListener('touchend', handlePressOut);
        touchArea.addEventListener('touchcancel', handlePressOut);
        
        touchArea.addEventListener('mousedown', handlePressIn);
        touchArea.addEventListener('mouseup', handlePressOut);
        touchArea.addEventListener('mouseleave', handlePressOut);

        // Prevent the long-press right-click menu popping up
        window.addEventListener('contextmenu', function (e) { 
            e.preventDefault(); 
        });

        // Close overlay logic
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            stopTimers();
        });
        overlay.addEventListener('touchstart', (e) => {
            e.preventDefault();
            overlay.style.display = 'none';
            stopTimers();
        });

    </script>
</body>
</html>
